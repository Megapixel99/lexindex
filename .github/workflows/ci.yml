name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # `npm test` exiting 0 does not mean the suite ran. `test/*.test.js` is a glob, and a
      # glob that matches two files instead of nine reports exactly the same green as one
      # that matches all of them. These two put a floor under the denominator: `didrun`
      # asks whether a command did anything at all, `zerocase` reads the number out of the
      # report the runner already wrote. Installed globally on purpose -- this package
      # claims no dependencies of its own, and that claim stays true.
      - name: install the guards
        run: |
          npm install -g @megapixel99/didrun
          npm install -g zerocase

      # `test:ci` is `npm test` with a junit report beside it. The floor applies to what
      # EXECUTED, not to the total, so a suite that skipped its way to green does not clear
      # it either. 200 is a floor under collapse rather than a target: the suite runs
      # 250-odd today, and losing a whole file should fail here instead of passing quietly.
      - name: the suite ran, and ran enough of itself to mean anything
        run: zerocase --junit reports/junit.xml --min 200 -- npm run test:ci

  # The README's central instruction is "run the measurement on your own repo". If the
  # harness cannot run, that instruction is broken, so CI runs it against this repo. The
  # numbers are not asserted — the corpus is tiny and any threshold would be noise. What
  # is asserted is that the harness reaches a verdict rather than crashing or refusing.
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: install the guards
        run: |
          npm install -g @megapixel99/didrun
          npm install -g zerocase

      # This step used to be `grep -q 'COMPLETE'`, which is the exact hole `didrun` was
      # written about: the harness prints `COMPLETE : 0 positions scored` for a corpus it
      # scored nothing on, and the grep is satisfied by it. Reading the count instead means
      # the line has to carry a real number. The README also points people at the
      # re-ranking measurement, so that has to be there -- either with numbers or with the
      # reason it will not print any. Both predicates must hold; `didrun` uses `every`.
      - name: the harness runs and reaches a verdict
        run: |
          didrun --expect-count 'COMPLETE : ([0-9]+) positions scored' --min 50 \
                 --expect 'RE-RANKING' \
                 -- node tools/measure.mjs ./src ./tools ./test

      # The lexer never cared what language it read; the defaults did. This asserts the
      # default is still JavaScript-only, so no number in the README quietly changes.
      - name: the default corpus is still the JavaScript family
        run: |
          mkdir -p /tmp/langcheck
          printf 'x = 1\n' > /tmp/langcheck/a.py
          if node bin/lexindex.js /tmp/langcheck --stats; then
            echo "::error::a Python-only tree was indexed by default; the default widened"
            exit 1
          fi
          node bin/lexindex.js /tmp/langcheck --lang python --stats | grep -q 'files    : 1'

      # The floor is read straight out of the document the harness wrote, at the dotted
      # path that holds it, and `zerocase` requires that document to have been written by
      # THIS run: a `/tmp/m.json` left from an earlier step parses beautifully and proves
      # nothing. The two assertions below are about the document's SHAPE, which is a
      # different question and stays where it is.
      - name: --json emits one object and no prose beside it
        run: |
          zerocase --json /tmp/m.json:positions.scored --min 50 \
            -- bash -c 'node tools/measure.mjs --json ./src ./tools ./test > /tmp/m.json'
          node -e '
            const o = JSON.parse(require("fs").readFileSync("/tmp/m.json", "utf8"));
            if (typeof o.recital !== "number") throw new Error("no recital in the JSON");
            if (!o.rerank) throw new Error("no re-ranking measurement in the JSON");
          ' 
      - name: the package ships what the README tells people to run
        run: |
          npm pack --dry-run 2>&1 | grep -q 'tools/measure.mjs'

      # Install the real tarball rather than trusting the source tree. `exports` shipped
      # once as a bare string, which permits no subpaths, so `require('lexindex/package.json')`
      # threw ERR_PACKAGE_PATH_NOT_EXPORTED for any tool that reads a dependency's manifest.
      # Nothing in the source tree could catch that; only an install can.
      - name: an installed copy resolves the entry point, the manifest and both subpaths
        run: |
          tarball="$(npm pack --silent)"
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE/$tarball" --silent
          node -e "const v=require('lexindex/package.json').version; console.log('manifest subpath ok', v)"
          node -e "import('lexindex').then(m=>{if(!m.buildIndex||!m.Completer)throw new Error('missing exports');console.log('entry point ok')})"
          # The browser subpath exists so a bundler is not handed node:fs. If it resolves
          # to something still carrying buildIndex, it is not doing its one job.
          node -e "import('lexindex/browser').then(m=>{if(!m.DocumentSet||!m.Completer)throw new Error('missing exports');if(m.buildIndex)throw new Error('the browser entry still exports buildIndex');console.log('browser subpath ok')})"
          node -e "import('lexindex/codemirror').then(m=>{if(!m.completionSource)throw new Error('missing completionSource');console.log('codemirror subpath ok')})"
          node -e "import('lexindex/monaco').then(m=>{if(!m.completionProvider)throw new Error('missing completionProvider');console.log('monaco subpath ok')})"
          # Both binaries must be on PATH in a real install, not just present in the tree.
          test -x node_modules/.bin/lexindex     || { echo "::error::lexindex not installed as a binary"; exit 1; }
          test -x node_modules/.bin/lexindex-lsp || { echo "::error::lexindex-lsp not installed as a binary"; exit 1; }
          echo 'export const consumerSymbol = 1;' > sample.js
          # Same hole as the measure job's old `grep -q 'COMPLETE'`, one layer down: an
          # installed CLI that walks the tree and finds nothing prints its stats table and
          # exits 0. The file count is what says it indexed the sample.
          didrun --expect-count 'files *: ([0-9]+)' -- node_modules/.bin/lexindex . --stats
          # Drive the installed server the way an editor does: one framed initialize, one
          # framed reply. A server that ships but cannot answer a handshake is not shipped.
          node -e '
            const { spawn } = require("child_process");
            const p = spawn("node_modules/.bin/lexindex-lsp", [], { stdio: ["pipe", "pipe", "inherit"] });
            const body = Buffer.from(JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "initialize",
              params: { rootUri: "file://" + process.cwd(), capabilities: {} },
            }), "utf8");
            p.stdin.write("Content-Length: " + body.length + "\r\n\r\n");
            p.stdin.write(body);
            let out = "";
            const timer = setTimeout(() => { console.error("no reply from lexindex-lsp"); process.exit(1); }, 20000);
            p.stdout.on("data", (d) => {
              out += d;
              if (!out.includes("completionProvider")) return;
              clearTimeout(timer);
              console.log("language server handshake ok");
              p.kill();
              process.exit(0);
            });
          ' 
